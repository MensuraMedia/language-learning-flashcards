[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-practice"
description = "A local flash-card trainer for hiragana, katakana and JLPT kanji."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Japanese Practice" }]
keywords = ["japanese", "kana", "kanji", "flashcards", "jlpt", "srs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dynamic = ["version"]
dependencies = [
    "quart>=0.19",
    "aiosqlite>=0.19",
    "pywebview>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.1",
    "ruff>=0.4",
]

[project.scripts]
japanese-practice = "japanese_practice.__main__:main"

[tool.setuptools]
include-package-data = false
# NOTICE carries the attribution text a derivative work must display, so it has
# to travel with the distribution rather than living only in the repository.
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.dynamic]
version = { attr = "japanese_practice.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
japanese_practice = [
    "schema.sql",
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/icons/*",
    "static/audio/*",
    "static/audio/**/*",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is black's job
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["japanese_practice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:japanese_practice.*"]
