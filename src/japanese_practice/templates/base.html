<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Japanese Practice{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark"></span>
      <span class="brand-name">Japanese Practice</span>
      <span class="brand-jp">日本語練習</span>
    </a>
    <div class="topbar-right">{% block topbar %}{% endblock %}</div>
  </header>
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
